    name: 全部字段测试
    description: 覆盖 GitHub issue 表单全部 6 种控件类型
    title: "[字段测试] "
    labels: ["triage"]
    assignees: []
    body:
      # 1. markdown：仅展示说明，不提交进正文
      - type: markdown
        attributes:
          value: |
            ## GitHub issue 表单全字段测试
            本模板覆盖全部 6 种控件：markdown / textarea / input / dropdown / checkboxes / upload。
            **本段说明文字不会进入最终 issue 正文。**
    
      # 2. input：单行文本框
      - type: input                                                                                                                 
        id: contact                                                                                                                 
        attributes:                                                                                                                 
          label: 联系方式                                                                                                           
          description: 需要更多信息时如何联系你？                                                                                   
          placeholder: "例：email@example.com"                                                                                      
          value: ""                                                                                                                 
        validations:                                                                                                                
          required: false                                                                                                           
                                                                                                                                    
      # 3. textarea：多行文本域（含 render 代码块格式化）                                                                           
      - type: textarea                                                                                                              
        id: logs                                                                                                                    
        attributes:                                                                                                                 
          label: 相关日志                                                                                                           
          description: 粘贴相关日志，将自动格式化为代码块                                                                           
          placeholder: 在这里粘贴日志                                                                                               
          value: |                                                                                                                  
            - 环境:                                                                                                                 
            - 版本:                                                                                                                 
          render: shell                                                                                                             
        validations:                                                                                                                
          required: true                                                                                                            
                                                                                                                                    
      # 4. dropdown：下拉菜单（默认单选）                                                                                           
      - type: dropdown                                                                                                              
        id: version                                                                                                                 
        attributes:                                                                                                                 
          label: 软件版本                                                                                                           
          description: 你当前使用的版本？                                                                                           
          options:                                                                                                                  
            - 1.0.2 (Default)                                                                                                       
            - 1.0.3 (Edge)                                                                                                          
          default: 0                                                                                                                
        validations:                                                                                                                
          required: true                                                                                                            
                                                                                                                                    
      # 5. checkboxes：复选框组（单个勾选项可强制必选）                                                                             
      - type: checkboxes                                                                                                            
        id: terms                                                                                                                   
        attributes:                                                                                                                 
          label: 确认事项                                                                                                           
          description: 提交前请确认                                                                                                 
          options:                                                                                                                  
            - label: 我已搜索过既有 Issue，确认无重复                                                                               
              required: true                                                                                                        
            - label: 我已阅读行为准则                                                                                               
              required: false                                                                                                       
                                                                                                                                    
      # 6. upload：文件上传（截图/附件）                                                                                            
      - type: upload                                                                                                                
        id: screenshots                                                                                                             
        attributes:                                                                                                                 
          label: 截图上传                                                                                                           
          description: 如适用，请上传截图帮助说明问题                                                                               
        validations:                                                                                                                
          required: false
